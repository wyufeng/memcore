[project]
name = "memcore"
version = "0.1.0"
description = "内网离线、免 sudo 的长记忆内核，为 Claude Code / opencode 提供跨会话记忆"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wyufeng" }]
keywords = ["mcp", "memory", "claude-code", "opencode", "offline", "no-deps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
memcore = "memcore.cli:main"

[project.urls]
Homepage = "https://github.com/wyufeng/memcore"
Repository = "https://github.com/wyufeng/memcore"

[tool.setuptools]
packages = ["memcore"]
